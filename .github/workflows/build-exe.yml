name: Build Windows EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**.py"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build EG Craft Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke tests
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          EGCRAFT_HEADLESS: "1"
        run: python run.py --smoke --frames 60

      - name: Run repository audit
        shell: pwsh
        run: python scripts/audit.py

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name EG-Craft `
            --add-data "assets;assets" `
            --collect-all pygame `
            --collect-all OpenGL `
            --collect-submodules numpy `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EG-Craft/EG-Craft.exe")) {
            Write-Error "EG-Craft.exe was not created"
            exit 1
          }

          if (-not (Test-Path "dist/EG-Craft/assets")) {
            Write-Error "Assets folder was not included"
            exit 1
          }

      - name: Create ZIP file
        shell: pwsh
        run: |
          $zipName = "EG-Craft-windows-${{ github.sha }}.zip"

          Compress-Archive `
            -Path "dist/EG-Craft/*" `
            -DestinationPath $zipName `
            -Force

          "ZIP_NAME=$zipName" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EG-Craft-windows
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
